<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bouncing Ball Physics</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050505; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    
    /* 中上方時間容器 */
    #time-container {
      position: fixed; 
      top: 7%; 
      left: 0;
      width: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: center;
    }

    #time-display {
      color: rgba(255,255,255,.85); 
      font: 500 48px/1.25 ui-sans-serif, system-ui, "Microsoft JhengHei", sans-serif;
      font-variant-numeric: tabular-nums; 
      letter-spacing: .02em; 
      transition: opacity 0.5s ease;
      filter: blur(0.3px); 
      text-shadow: 
        0 0 6px rgba(255,255,255,0.6), 
        0 0 12px rgba(255,255,255,0.3),
        0 4px 12px rgba(0,0,0,0.8);
      opacity: 0; /* 預設隱藏 */
    }

    #time-display.visible {
      opacity: 0.92;
    }

    /* 下方 HUD 容器 (包含分數與模式提示) */
    #hud-container {
      position: fixed; 
      top: 93%; 
      transform: translateY(-100%); 
      left: 0;
      width: 100%; 
      z-index: 10;
      pointer-events: none; 
      display: flex;
      flex-direction: column;
      align-items: center; 
    }
    
    /* 分數數字樣式 */
    #score-number {
      color: rgba(235,235,235,.6); 
      font: 500 40px/1.25 ui-sans-serif, system-ui, "Microsoft JhengHei", sans-serif;
      font-variant-numeric: tabular-nums; 
      letter-spacing: .02em; 
      transition: opacity 0.5s ease;
      
      /* --- 新增：字體邊緣模糊化與柔和發光 --- */
      filter: blur(0.5px); 
      text-shadow: 
        0 0 6px rgba(255,255,255,0.6), 
        0 0 12px rgba(255,255,255,0.3),
        0 4px 12px rgba(0,0,0,0.8); /* 保留底部黑陰影增加對比 */
    }

    /* 模式提示 Toast 樣式 */
    #mode-toast {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
      opacity: 0;
      transition: opacity 0.3s ease;
      font-family: ui-sans-serif, system-ui, "Microsoft JhengHei", sans-serif;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    
    /* 分數顯示模式 */
    #score-number.score-mode-always { opacity: 0.92; }
    #score-number.score-mode-hidden { opacity: 0; }
    #score-number.score-mode-smart { opacity: 0; }
    #score-number.score-mode-smart.active { opacity: 0.92; }

    .hint {
      position: fixed; left: 24px; bottom: 22px; z-index: 1;
      color: rgba(255,255,255,.38); font: 13px/1.4 ui-sans-serif, system-ui, "Microsoft JhengHei", sans-serif;
      user-select: none;
      pointer-events: none;
    }
    .btn-action {
      cursor: pointer;
      pointer-events: auto;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s;
    }
    .btn-action:hover { color: rgba(255,255,255,.8); }
    
    @media (max-width: 560px) {
      #time-container { top: 5%; }
      #time-display { font-size: 38px; }
      #hud-container { top: 93%; }
      #score-number { font-size: 38px; }
      .hint { left: 18px; bottom: 16px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="bouncing sim"></canvas>
  
  <div id="time-container">
    <div id="time-display">00:00:00</div>
  </div>

  <div id="hud-container">
    <div id="score-number" class="score-mode-hidden">0</div>
    <div id="mode-toast">Off</div>
  </div>
  
  <div class="hint">
    <span id="time-btn" class="btn-action">Show time</span> · 
    <span id="disp-mode-btn" class="btn-action">Show number</span> · 
    <span id="fullscreen-btn" class="btn-action">Fullscreen</span> · 
    <!-- Tap to interact -->
  </div>

  <script>
    "use strict";

    /*
      ── 可調整參數 ────────────────────────────────────────────
      修改這一區即可調整整個模擬；數值以畫布的 CSS 像素與秒為單位。
    */
    const CONFIG = {
      BALL_RADIUS: 8,                  // 球半徑
      GRAVITY: 400,                    // 向下重力（px/s²）
      START_SPEED_MIN: 10,             // 開始時的隨機最小速度
      START_SPEED_MAX: 500,            // 開始時的隨機最大速度
      BOUNCINESS: 0.77,                // 0~1；圓環碰撞後保留的法向速度
      SURFACE_FRICTION: 0.7,           // 0~1；碰撞時切向速度／旋轉交換程度
      BALL_AIR_DRAG: 0.012,            // 空氣阻力，避免速度無限制累積

      FIRST_RING_RADIUS: 118,          // 最內圈半徑
      RING_SPACING: 32,                // 各圈等距間隔
      VISIBLE_RING_COUNT: 13,          // 同時保留的圓環數量（通過後自動補上）
      RING_STROKE: 2.2,                // 圓環線寬
      
      GAP_ROTATION_SPEED_MIN: 0.1,     // 最小轉速
      GAP_ROTATION_SPEED_MAX: 0.85,    // 最大轉速

      GAP_WIDTH_MIN_RATIO: 1.5,        // 最小缺口倍率
      GAP_WIDTH_MAX_RATIO: 3.2,        // 最大缺口倍率

      BOOST_CHANCE: 0.05,              // 加速觸發機率 (0.07 = 7%)
      BOOSTED_BOUNCES: 1,              // 每次啟動後加速幾次彈跳
      BOOST_MULTIPLIER: 2,           // 加速彈跳倍率
      MAX_SPEED: 1050,                 // 速度安全上限
      MIN_SPEED: 270,                  // 速度安全下限，防止球靜止 (px/s)
      
      RING_SHRINK_SPEED: 5,            // 圓框內縮速度 (px/s)
      RING_MIN_RADIUS: 12,             // 圓框最小半徑 (需大於球體，以免破圖)

      // 圓環受擊彈性震動參數
      RING_SHAKE_MULTIPLIER: 0.22,     // 圓環震動幅度倍率 (依據碰撞力道)
      RING_SHAKE_STIFFNESS: 1500,      // 震動彈簧剛性 (越高頻率越快、越快回彈)
      RING_SHAKE_DAMPING: 25,          // 震動阻尼 (越高越快停止震動)

      // 碎裂沙子顆粒系統參數
      SAND_MAX_TOTAL_COUNT: 2000,      // 畫面上允許的最大沙子總數
      SAND_FADE_RATE: 1.5,             // 超量時舊沙子的漸隱速度 (越小消失越慢)
      SAND_OPACITY: 0.3,               // 調整沙子初始透明度 (0.0 完全透明 ~ 1.0 完全不透明)
      SAND_COUNT: 1000,                // 破碎產生的沙粒數量
      SAND_GRAVITY: 200,               // 沙粒掉落的重力
      SAND_BOUNCE: 0.35,               // 沙粒碰撞圓環的彈性 (低彈性如沙)
      SAND_FRICTION: 0.85,             // 沙粒在圓環上滑動的摩擦保留率
      SAND_SIZE_MIN: 0.2,              // 沙粒最小半徑
      SAND_SIZE_MAX: 0.8,              // 沙粒最大半徑
      
      SAND_WAKE_MULTIPLIER: 0.45,      // ★新增：沙粒受到球體風壓影響的倍率 (沙子較重所以小於 1)
      SAND_BALL_BOUNCE: 0.65,          // ★新增：沙粒與球體碰撞時的彈性

      // 體積煙霧粒子系統參數 (保留給球體摩擦與點擊)
      SMOKE_MAX_LIFE: 6,               // 煙霧存活最大秒數
      RING_BREAK_SMOKE_COUNT: 100,     // 圓環破碎時產生的煙霧數量
      WAKE_RADIUS: 70,                 // 球體影響煙霧的流體半徑 (風壓範圍)
      WAKE_FORCE: 420,                 // 球體帶動煙霧的推力
      UPDRAFT_FORCE: 37,               // 熱氣流向上飄散的基礎加速度

      // 環境自然風參數
      WIND_FORCE_MIN: 10,              
      WIND_FORCE_MAX: 85,              
      WIND_CHANGE_INTERVAL: 3.5,       
      WIND_SPACING_MULTIPLIER: 0.016,  // 風力影響圓環間距的倍率
      WIND_BEND_MULTIPLIER: 0.0006,    // 風力影響隧道 X/Y 彎曲偏移的倍率

      // 絕對距離視覺漸變參數
      FADE_START_RADIUS: 120,          // 半徑小於此值：完全實體、最亮
      FADE_END_RADIUS: 422,            // 半徑大於此值：完全透明、融入黑暗
      USER_IMPULSE: 550,               // 點擊畫面施加的排斥力道 (px/s)

      // 點擊煙霧參數 (壓入螢幕向外擴散)
      CLICK_SMOKE_COUNT: 20,           // 點擊生成的煙霧數量
      CLICK_SMOKE_RADIUS: 10,          // 點擊煙霧生成的初始半徑
      CLICK_SMOKE_BURST_MIN: 20,       // 最小向外擴散速度
      CLICK_SMOKE_BURST_MAX: 80,       // 最大向外擴散速度

      // 球體噴煙參數
      BALL_BOOST_DURATION: 0.1,        // 噴煙持續時間 (秒)
      BALL_BOOST_SMOKE_COUNT: 30,      // 噴煙數量
      BALL_BOOST_SMOKE_SPEED: 310,     // 噴射的扇形速度
      BALL_BOOST_SMOKE_SPREAD: 1.5,    // 散佈角度 (弧度)
    };  


    const canvas = document.getElementById("scene");
    const context = canvas.getContext("2d");
    const scoreNumber = document.getElementById("score-number");
    const modeToast = document.getElementById("mode-toast");
    const dispModeBtn = document.getElementById("disp-mode-btn");
    const fullscreenBtn = document.getElementById("fullscreen-btn");
    
    const timeDisplay = document.getElementById("time-display");
    const timeBtn = document.getElementById("time-btn");

    const SCORE_MODE_SMART = 0;
    const SCORE_MODE_ALWAYS = 1;
    const SCORE_MODE_HIDDEN = 2;
    const MODE_NAMES = ["Display when passing", "Always", "Off"];
    let scoreMode = SCORE_MODE_HIDDEN; 
    
    let smartShowTimeout = null;
    let toastTimeout = null;

    let isTimeVisible = false;

    let width = 0;
    let height = 0;
    let dpr = 1;
    let center = { x: 0, y: 0 };
    let lastTime = performance.now();
    let paused = false;
    let passCount = 0;
    let bounceCount = 0;
    let boostRemaining = 0;
    let nextRingId = 0;
    
    let nextParticleId = 0; 
    
    const spatialGrid = new Map();
    const SAND_CELL_SIZE = 4; // 網格尺寸大小，稍微大於沙粒的極限直徑即可
    
    let rings = [];
    let ball;
    let ripples = []; 
    let particles = []; 
    
    let envWind = {
      vx: 0, vy: 0, targetVx: 0, targetVy: 0, timer: 0
    };

    const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
    const angleDistance = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));

    // 時間顯示切換邏輯 (改為顯示裝置本地時間)
    timeBtn.addEventListener("click", (e) => {
      if (e) e.stopPropagation();
      isTimeVisible = !isTimeVisible;
      
      if (isTimeVisible) {
        // 點擊時立即更新一次文字，避免等待下一幀
        const now = new Date();
        const h = now.getHours().toString().padStart(2, '0');
        const m = now.getMinutes().toString().padStart(2, '0');
        const s = now.getSeconds().toString().padStart(2, '0');
        timeDisplay.textContent = `${h}:${m}:${s}`;
        
        timeDisplay.classList.add("visible");
        timeBtn.textContent = "Hide time";
      } else {
        timeDisplay.classList.remove("visible");
        timeBtn.textContent = "Show time";
      }
    });

    // 切換分數顯示模式與 Toast 動畫的邏輯
    function toggleScoreMode(e) {
      if (e) e.stopPropagation();
      scoreMode = (scoreMode + 1) % 3; // 切換邏輯維持不變，會依照新定義的順序輪轉
      updateScoreDisplayMode();
      
      // Toast Fade in out 效果
      modeToast.textContent = MODE_NAMES[scoreMode];
      modeToast.style.opacity = 1;
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        modeToast.style.opacity = 0;
      }, 1500); // 浮現 1.5 秒後淡出
    }

    dispModeBtn.addEventListener("click", toggleScoreMode);

    function updateScoreDisplayMode() {
      scoreNumber.classList.remove("score-mode-always", "score-mode-smart", "score-mode-hidden", "active");
      if (scoreMode === SCORE_MODE_ALWAYS) {
        scoreNumber.classList.add("score-mode-always");
      } else if (scoreMode === SCORE_MODE_SMART) {
        scoreNumber.classList.add("score-mode-smart");
        triggerSmartShow(); // 點擊切換到智慧模式時先顯示一次確認
      } else if (scoreMode === SCORE_MODE_HIDDEN) {
        scoreNumber.classList.add("score-mode-hidden");
      }
    }

    function triggerSmartShow() {
      if (scoreMode !== SCORE_MODE_SMART) return;
      scoreNumber.classList.add("active");
      if (smartShowTimeout) clearTimeout(smartShowTimeout);
      smartShowTimeout = setTimeout(() => {
        scoreNumber.classList.remove("active");
      }, 2000); // 智慧模式下顯示 2 秒
    }

    function resize() {
      const previousCenter = center;
      const relativeBallX = ball ? ball.x - previousCenter.x : 0;
      const relativeBallY = ball ? ball.y - previousCenter.y : 0;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      context.setTransform(dpr, 0, 0, dpr, 0, 0);
      center = { x: width / 2, y: height / 2 };
      if (ball) {
        const changeX = center.x - previousCenter.x;
        const changeY = center.y - previousCenter.y;
        ball.x = center.x + relativeBallX;
        ball.y = center.y + relativeBallY;
        ball.trail.forEach((point) => {
          point.x += changeX;
          point.y += changeY;
        });
      }
    }

    function randomGapAngle(id) {
      const seeded = Math.sin(id * 127.1 + 19.7) * 43758.5453123;
      return ((seeded - Math.floor(seeded)) * Math.PI * 2) - Math.PI;
    }

    function getGapHalfAngle(ring) {
      const physicalGapWidth = (CONFIG.BALL_RADIUS * 2) * ring.gapWidthRatio;
      const halfGap = physicalGapWidth / 2;
      return Math.asin(clamp(halfGap / ring.radius, 0, 0.95));
    }

    function createRing(radius) {
      const id = nextRingId++;
      const randomSpeed = CONFIG.GAP_ROTATION_SPEED_MIN + Math.random() * (CONFIG.GAP_ROTATION_SPEED_MAX - CONFIG.GAP_ROTATION_SPEED_MIN);
      const direction = Math.random() < 0.5 ? 1 : -1;
      const finalRotationSpeed = randomSpeed * direction;
      const gapWidthRatio = CONFIG.GAP_WIDTH_MIN_RATIO + Math.random() * (CONFIG.GAP_WIDTH_MAX_RATIO - CONFIG.GAP_WIDTH_MIN_RATIO);

      return {
        id,
        radius,
        gapAngle: randomGapAngle(id),
        rotationSpeed: finalRotationSpeed,
        gapWidthRatio: gapWidthRatio,      
        broken: false,
        shakeX: 0,
        shakeY: 0,
        shakeVx: 0,
        shakeVy: 0,
        windOffsetX: 0, 
        windOffsetY: 0  
      };
    }

    function reset() {
      passCount = 0;
      bounceCount = 0;
      boostRemaining = 0;
      nextRingId = 0;
      nextParticleId = 0;

      rings = [];
      for (let index = 0; index < CONFIG.VISIBLE_RING_COUNT; index += 1) {
        rings.push(createRing(CONFIG.FIRST_RING_RADIUS + index * CONFIG.RING_SPACING));
      }
      // 產生 0 ~ 360 度的隨機角度 (Math.PI * 2 代表 360 度)
      const randomAngle = Math.random() * Math.PI * 2;
      // 在我們設定的最小值與最大值之間產生隨機速度
      const randomSpeed = CONFIG.START_SPEED_MIN + Math.random() * (CONFIG.START_SPEED_MAX - CONFIG.START_SPEED_MIN);

      ball = {
        x: center.x,
        y: center.y - 18,
        // 利用三角函數將隨機角度與速度轉換為 X 和 Y 軸的向量速度
        vx: Math.cos(randomAngle) * randomSpeed,
        vy: Math.sin(randomAngle) * randomSpeed,
        angle: 0,
        spin: 0,
        trail: [],
        boostSmokeTimer: 0,        
        boostSmokeAccumulator: 0, 
        boostDirX: 0,             
        boostDirY: 0,
      };
      ripples = [];
      particles = [];
      envWind = { vx: 0, vy: 0, targetVx: 0, targetVy: 0, timer: 0 };
      
      scoreNumber.textContent = "0";
      paused = false;
      lastTime = performance.now();
    }

    function activeRing() {
      return rings.find((ring) => !ring.broken);
    }

    function inGap(ring, angle) {
      return Math.abs(angleDistance(angle, ring.gapAngle)) <= getGapHalfAngle(ring);
    }

    function breakRing(ring) {
      const ratio = clamp((ring.radius - CONFIG.FADE_START_RADIUS) / (CONFIG.FADE_END_RADIUS - CONFIG.FADE_START_RADIUS), 0, 1);
      const easeRatio = Math.pow(ratio, 1.2); 
      const r = Math.round(222 + (5 - 222) * easeRatio);
      const g = Math.round(226 + (5 - 226) * easeRatio);
      const b = Math.round(229 + (5 - 229) * easeRatio);
      const baseAlpha = 1 - easeRatio;

      const gap = getGapHalfAngle(ring);
      const startAngle = ring.gapAngle + gap;
      const endAngle = ring.gapAngle - gap + Math.PI * 2;
      const arcLength = endAngle - startAngle;
      
      const vTan = ring.radius * ring.rotationSpeed; 
      
      const ringCenterX = center.x + ring.windOffsetX + ring.shakeX;
      const ringCenterY = center.y + ring.windOffsetY + ring.shakeY;

      // 套用透明度調整
      const sandAlpha = Math.max(0, baseAlpha * CONFIG.SAND_OPACITY);

      // 產生固態沙子
      for (let i = 0; i < CONFIG.SAND_COUNT; i++) {
        const angle = startAngle + Math.random() * arcLength;
        const radiusOffset = (Math.random() - 0.5) * CONFIG.RING_STROKE * 1.5;
        
        const px = ringCenterX + Math.cos(angle) * (ring.radius + radiusOffset);
        const py = ringCenterY + Math.sin(angle) * (ring.radius + radiusOffset);

        const vxTan = -Math.sin(angle) * vTan;
        const vyTan = Math.cos(angle) * vTan;
        
        const burst = (Math.random() - 0.5) * 80;
        const burstX = Math.cos(angle) * burst;
        const burstY = Math.sin(angle) * burst;
        
        particles.push({
          id: nextParticleId++, 
          type: 'sand', 
          x: px, y: py,
          vx: vxTan * 1.5 + burstX,  // 保留部份圓環旋轉動能
          vy: vyTan * 1.5 + burstY,
          size: CONFIG.SAND_SIZE_MIN + Math.random() * (CONFIG.SAND_SIZE_MAX - CONFIG.SAND_SIZE_MIN),
          r: r, g: g, b: b, alpha: sandAlpha,
          fading: false,  
          dead: false,
          
          smokeTimer: 0.5,                         // 0.5秒內遞減
          smokeAccumulator: Math.random() * 0.5    // 錯開噴發頻率
        });
      }

      // 產生煙霧效果
      for (let i = 0; i < CONFIG.RING_BREAK_SMOKE_COUNT; i++) {
        const angle = startAngle + Math.random() * arcLength;
        const radiusOffset = (Math.random() - 0.5) * CONFIG.RING_STROKE * 4;
        
        const px = ringCenterX + Math.cos(angle) * (ring.radius + radiusOffset);
        const py = ringCenterY + Math.sin(angle) * (ring.radius + radiusOffset);

        const vxTan = -Math.sin(angle) * vTan;
        const vyTan = Math.cos(angle) * vTan;
        
        // 給煙霧一點微小向外或向內爆裂的力道
        const burst = (Math.random() - 0.5) * 60;
        const burstX = Math.cos(angle) * burst;
        const burstY = Math.sin(angle) * burst;
        
        particles.push({
          id: nextParticleId++,
          type: 'smoke',
          x: px, y: py,
          vx: vxTan * 1.2 + burstX,  // 保留部份圓環旋轉動能
          vy: vyTan * 1.2 + burstY,
          life: 0,
          maxLife: CONFIG.SMOKE_MAX_LIFE * (0.15 + Math.random() * 1), // 破碎煙霧壽命
          size: Math.random() * 8 + 4,
          growth: 15 + Math.random() * 10,
          color: `215, 220, 225`,
          baseAlpha: 0.15 + Math.random() * 0.1,
          swirlPhaseX: Math.random() * Math.PI * 2, 
          swirlPhaseY: Math.random() * Math.PI * 2,
          swirlFreq: 1.5 + Math.random() * 2, 
          swirlAmp: 10 + Math.random() * 20
        });
      }

      ring.broken = true;
      passCount += 1;
      scoreNumber.textContent = String(passCount);

      // UI 顯示邏輯
      triggerSmartShow();
    }

    function collideWithRing(ring) {
      const ringCenterX = center.x + ring.windOffsetX;
      const ringCenterY = center.y + ring.windOffsetY;

      const dx = ball.x - ringCenterX;
      const dy = ball.y - ringCenterY;
      const distance = Math.hypot(dx, dy) || 0.0001;
      const normalX = dx / distance;
      const normalY = dy / distance;
      const angle = Math.atan2(dy, dx);
      const radialVelocity = ball.vx * normalX + ball.vy * normalY;
      const innerBoundary = ring.radius - CONFIG.BALL_RADIUS;

      if (distance < innerBoundary || radialVelocity <= 0) return;

      if (inGap(ring, angle)) {
        breakRing(ring);
        return;
      }

      ring.shakeVx += normalX * radialVelocity * CONFIG.RING_SHAKE_MULTIPLIER;
      ring.shakeVy += normalY * radialVelocity * CONFIG.RING_SHAKE_MULTIPLIER;

      ball.x = ringCenterX + normalX * innerBoundary;
      ball.y = ringCenterY + normalY * innerBoundary;

      const tangentX = -normalY;
      const tangentY = normalX;
      
      const tangentVelocity = ball.vx * tangentX + ball.vy * tangentY;
      let rebound = -radialVelocity * CONFIG.BOUNCINESS;

      // 新增：如果目前沒有在加速狀態，依照機率骰出是否觸發加速
      if (boostRemaining === 0 && Math.random() < CONFIG.BOOST_CHANCE) {
        boostRemaining = CONFIG.BOOSTED_BOUNCES;
      }

      if (boostRemaining > 0) {
        rebound *= CONFIG.BOOST_MULTIPLIER;
        boostRemaining -= 1;

        // --- 產生加速噴煙 (較少量) ---
        // 煙霧朝向撞擊面(外側)噴出，即 normalX, normalY 的方向
        const spawnAngle = Math.atan2(normalY, normalX);
        const halfSpread = CONFIG.BALL_BOOST_SMOKE_SPREAD / 2;
        // 取設定檔噴煙量的 40% 作為單次碰撞的少量噴煙 (可調整 0.4 這個倍率)
        const smokeAmount = Math.floor(CONFIG.BALL_BOOST_SMOKE_COUNT * 0.2);

        for (let i = 0; i < smokeAmount; i++) {
          const angleOffset = (Math.random() - 0.5) * CONFIG.BALL_BOOST_SMOKE_SPREAD;
          const angle = spawnAngle + angleOffset;
          const px = ball.x + Math.cos(angle) * CONFIG.BALL_RADIUS * 0.8;
          const py = ball.y + Math.sin(angle) * CONFIG.BALL_RADIUS * 0.8;
          const offsetRatio = angleOffset / halfSpread; 
          const shapeProfile = 1 - Math.pow(offsetRatio, 2); 
          const baseSpeed = CONFIG.BALL_BOOST_SMOKE_SPEED * (0.15 + 0.85 * shapeProfile);
          const partSpeed = baseSpeed * (0.8 + Math.random() * 0.4);
          const vx = Math.cos(angle) * partSpeed + ball.vx * 0.12;
          const vy = Math.sin(angle) * partSpeed + ball.vy * 0.12;

          particles.push({
            id: nextParticleId++,
            type: 'smoke',
            x: px, y: py, vx: vx, vy: vy, life: 0,
            maxLife: CONFIG.SMOKE_MAX_LIFE * (0.3 + Math.random() * 0.3), 
            size: Math.random() * 10 + 5,        
            growth: 15 + Math.random() * 10,   
            color: `215, 220, 225`,            
            baseAlpha: 0.15 + Math.random() * 0.1, 
            swirlPhaseX: Math.random() * Math.PI * 2, swirlPhaseY: Math.random() * Math.PI * 2,
            swirlFreq: 1.5 + Math.random() * 2, swirlAmp: 10 + Math.random() * 20
          });
        }
        // ---------------------------
      }
      
      const ringAngularVelocity = ring.rotationSpeed;
      const ringSurfaceVelocity = ring.radius * ringAngularVelocity;
      const ballSurfaceVel = tangentVelocity + ball.spin * CONFIG.BALL_RADIUS;
      const slipVel = ballSurfaceVel - ringSurfaceVelocity;
      const frictionImpulse = slipVel * (CONFIG.SURFACE_FRICTION / 2);
      const newTangentVelocity = tangentVelocity - frictionImpulse;

      ball.vx = normalX * rebound + tangentX * newTangentVelocity;
      ball.vy = normalY * rebound + tangentY * newTangentVelocity;
      ball.spin -= frictionImpulse / CONFIG.BALL_RADIUS;

      bounceCount += 1;

      // 碰撞煙霧
      for (let i = 0; i < 2; i++) {
        const sides = [1, -1]; 
        sides.forEach(side => {
          const startX = ball.x + tangentX * side * CONFIG.BALL_RADIUS;
          const startY = ball.y + tangentY * side * CONFIG.BALL_RADIUS;
          const tangentSpeed = 0.2 + Math.random() * 0.02; 
          const inwardSpeed = 0.1 + Math.random() * 0.01;  
          const vx = (tangentX * side * tangentSpeed) - (normalX * inwardSpeed);
          const vy = (tangentY * side * tangentSpeed) - (normalY * inwardSpeed);

          particles.push({
            id: nextParticleId++,
            type: 'smoke',
            x: startX, 
            y: startY, 
            vx: vx + ball.vx * 0.015,
            vy: vy + ball.vy * 0.015, 
            life: 0,
            maxLife: CONFIG.SMOKE_MAX_LIFE * (0.1 + Math.random() * 0.1), 
            size: Math.random() * 4 + 1,
            growth: 8 + Math.random() * 2,
            color: `215, 220, 225`,
            baseAlpha: 0.2 + Math.random() * 0.1,
            swirlPhaseX: Math.random() * Math.PI * 2, 
            swirlPhaseY: Math.random() * Math.PI * 2,
            swirlFreq: 1.5 + Math.random() * 2, 
            swirlAmp: 5 + Math.random() * 8
          });
        });
      }

      const postBounceSpeed = Math.hypot(ball.vx, ball.vy);
      if (postBounceSpeed < CONFIG.MIN_SPEED) {
        if (postBounceSpeed < 0.1) {
          ball.vx = -normalX * CONFIG.MIN_SPEED;
          ball.vy = -normalY * CONFIG.MIN_SPEED;
        } else {
          const scale = CONFIG.MIN_SPEED / postBounceSpeed;
          ball.vx *= scale;
          ball.vy *= scale;
        }
      }
    }

    function update(dt) {
      const drag = Math.max(0, 1 - CONFIG.BALL_AIR_DRAG * dt);
      ball.vx *= drag;
      ball.vy = ball.vy * drag + CONFIG.GRAVITY * dt;
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      ball.angle += ball.spin * dt;
      ball.spin *= Math.max(0, 1 - 0.28 * dt);

      envWind.timer -= dt;
      if (envWind.timer <= 0) {
        envWind.timer = CONFIG.WIND_CHANGE_INTERVAL + Math.random() * 2;
        const windForce = CONFIG.WIND_FORCE_MIN + Math.random() * (CONFIG.WIND_FORCE_MAX - CONFIG.WIND_FORCE_MIN);
        const windAngle = Math.random() * Math.PI * 2;
        envWind.targetVx = Math.cos(windAngle) * windForce;
        envWind.targetVy = Math.sin(windAngle) * windForce;
      }
      envWind.vx += (envWind.targetVx - envWind.vx) * dt * 0.5;
      envWind.vy += (envWind.targetVy - envWind.vy) * dt * 0.5;
      
      const currentWindForce = Math.hypot(envWind.vx, envWind.vy);
      const dynamicSpacing = CONFIG.RING_SPACING + (currentWindForce * CONFIG.WIND_SPACING_MULTIPLIER);

      const ring = activeRing();
      if (ring) collideWithRing(ring);

      const speed = Math.hypot(ball.vx, ball.vy);
      if (speed > CONFIG.MAX_SPEED) {
        const scale = CONFIG.MAX_SPEED / speed;
        ball.vx *= scale;
        ball.vy *= scale;
      }

      if (ball.boostSmokeTimer > 0) {
        ball.boostSmokeTimer -= dt;
        const emissionRate = CONFIG.BALL_BOOST_SMOKE_COUNT / CONFIG.BALL_BOOST_DURATION;
        ball.boostSmokeAccumulator += emissionRate * dt;

        while (ball.boostSmokeAccumulator >= 1) {
          ball.boostSmokeAccumulator -= 1;
          const spawnAngle = Math.atan2(ball.boostDirY, ball.boostDirX);
          const halfSpread = CONFIG.BALL_BOOST_SMOKE_SPREAD / 2;
          const angleOffset = (Math.random() - 0.5) * CONFIG.BALL_BOOST_SMOKE_SPREAD;
          const angle = spawnAngle + angleOffset;
          const px = ball.x + Math.cos(angle) * CONFIG.BALL_RADIUS * 0.8;
          const py = ball.y + Math.sin(angle) * CONFIG.BALL_RADIUS * 0.8;
          const offsetRatio = angleOffset / halfSpread; 
          const shapeProfile = 1 - Math.pow(offsetRatio, 2); 
          const baseSpeed = CONFIG.BALL_BOOST_SMOKE_SPEED * (0.15 + 0.85 * shapeProfile);
          const partSpeed = baseSpeed * (0.8 + Math.random() * 0.4);
          const vx = Math.cos(angle) * partSpeed + ball.vx * 0.12;
          const vy = Math.sin(angle) * partSpeed + ball.vy * 0.12;
          particles.push({
            id: nextParticleId++,
            type: 'smoke',
            x: px, y: py, vx: vx, vy: vy, life: 0,
            maxLife: CONFIG.SMOKE_MAX_LIFE * (0.3 + Math.random() * 0.3), 
            size: Math.random() * 10 + 5,        
            growth: 15 + Math.random() * 10,   
            color: `215, 220, 225`,            
            baseAlpha: 0.15 + Math.random() * 0.1, 
            swirlPhaseX: Math.random() * Math.PI * 2, swirlPhaseY: Math.random() * Math.PI * 2,
            swirlFreq: 1.5 + Math.random() * 2, swirlAmp: 10 + Math.random() * 20
          });
        }
      }

      let actualShrink = 0;
      if (ring) {
        actualShrink = Math.min(
          CONFIG.RING_SHRINK_SPEED * dt,
          Math.max(0, ring.radius - CONFIG.RING_MIN_RADIUS)
        );
      }

      let firstUnbroken = true;
      let previousRadius = 0;

      rings.forEach((item) => {
        item.gapAngle += item.rotationSpeed * dt;
        
        if (!item.broken) {
          if (firstUnbroken) {
            item.radius -= actualShrink;
            firstUnbroken = false;
            previousRadius = item.radius;
          } else {
            item.radius = previousRadius + dynamicSpacing;
            previousRadius = item.radius;
          }
        }
        
        item.windOffsetX = envWind.vx * item.radius * CONFIG.WIND_BEND_MULTIPLIER;
        item.windOffsetY = envWind.vy * item.radius * CONFIG.WIND_BEND_MULTIPLIER;

        item.shakeVx += (-CONFIG.RING_SHAKE_STIFFNESS * item.shakeX - CONFIG.RING_SHAKE_DAMPING * item.shakeVx) * dt;
        item.shakeVy += (-CONFIG.RING_SHAKE_STIFFNESS * item.shakeY - CONFIG.RING_SHAKE_DAMPING * item.shakeVy) * dt;
        item.shakeX += item.shakeVx * dt;
        item.shakeY += item.shakeVy * dt;
      });
      
      rings = rings.filter((item) => !item.broken);

      while (rings.length < CONFIG.VISIBLE_RING_COUNT) {
        const lastRadius = rings.length ? rings[rings.length - 1].radius : CONFIG.FIRST_RING_RADIUS;
        rings.push(createRing(lastRadius + dynamicSpacing));
      }

      ball.trail.push({ x: ball.x, y: ball.y, alpha: 1 });
      if (ball.trail.length > 13) ball.trail.shift();

      ripples.forEach(r => r.age += dt);
      ripples = ripples.filter(r => r.age < 0.6);

      let activeSandCount = 0;
      for (let i = 0; i < particles.length; i++) {
        if (particles[i].type === 'sand' && !particles[i].dead && !particles[i].fading) {
          activeSandCount++;
        }
      }
      let excessSand = activeSandCount - CONFIG.SAND_MAX_TOTAL_COUNT;

      const sandParticles = [];
      spatialGrid.clear();

      particles.forEach(p => {
        if (p.type === 'sand') {
          
          if (excessSand > 0 && !p.fading && !p.dead) {
            p.fading = true; 
            excessSand--;
          }
          
          if (p.fading) {
            p.alpha -= CONFIG.SAND_FADE_RATE * dt; 
            if (p.alpha <= 0) {
              p.alpha = 0;
              p.dead = true; 
            }
          }

          if (p.dead) return; 

          if (p.smokeTimer > 0) {
            p.smokeTimer -= dt;
            if (p.smokeTimer > 0) {
              const ratio = p.smokeTimer / 0.5; 
              p.smokeAccumulator += 3 * ratio * dt; 
              
              while (p.smokeAccumulator >= 1) {
                p.smokeAccumulator -= 1;
                particles.push({
                  id: nextParticleId++,
                  type: 'smoke',
                  x: p.x, 
                  y: p.y,
                  vx: p.vx * 0.15 + (Math.random() - 0.5) * 15,
                  vy: p.vy * 0.15 + (Math.random() - 0.5) * 15 - 15,
                  life: 0,
                  maxLife: CONFIG.SMOKE_MAX_LIFE * (0.05 + Math.random() * 0.05), 
                  size: Math.random() * 2 + 1.5, 
                  growth: 2 + Math.random() * 3, 
                  color: `215, 220, 225`,
                  baseAlpha: (0.1 + Math.random() * 0.05) * ratio, 
                  swirlPhaseX: Math.random() * Math.PI * 2,
                  swirlPhaseY: Math.random() * Math.PI * 2,
                  swirlFreq: 1.5 + Math.random() * 2,
                  swirlAmp: 4 + Math.random() * 4
                });
              }
            }
          }

          p.vy += CONFIG.SAND_GRAVITY * dt;
          
          p.vx += envWind.vx * dt * 0.3;
          p.vy += envWind.vy * dt * 0.3;

          // ★ 新增：計算沙子與球體距離，受到與煙霧同等的球體高速風壓影響
          const dxBall = p.x - ball.x;
          const dyBall = p.y - ball.y;
          const distBall = Math.hypot(dxBall, dyBall) || 0.001;

          if (distBall < CONFIG.WAKE_RADIUS) {
            const force = Math.pow(1 - distBall / CONFIG.WAKE_RADIUS, 1.5);
            const bSpeed = Math.hypot(ball.vx, ball.vy) || 1;
            const bDirX = ball.vx / bSpeed;
            const bDirY = ball.vy / bSpeed;
            const dot = dxBall * bDirX + dyBall * bDirY;
            
            // 由於沙子帶有物理質量（比煙霧重），所以乘上一個小於 1 的倍率 (CONFIG.SAND_WAKE_MULTIPLIER)
            const multiplier = CONFIG.SAND_WAKE_MULTIPLIER; 

            if (dot < 0) { // 在球體前方或被推擠
              p.vx += ball.vx * force * 2.8 * dt * multiplier;
              p.vy += ball.vy * force * 2.8 * dt * multiplier;
              const projX = bDirX * dot; 
              const projY = bDirY * dot;
              const toAxisX = projX - dxBall; 
              const toAxisY = projY - dyBall;
              const toAxisDist = Math.hypot(toAxisX, toAxisY) || 1;
              
              p.vx += (toAxisX / toAxisDist) * CONFIG.WAKE_FORCE * force * 0.9 * dt * multiplier;
              p.vy += (toAxisY / toAxisDist) * CONFIG.WAKE_FORCE * force * 0.9 * dt * multiplier;
            } else { // 尾流帶動
              p.vx += ball.vx * force * 0.5 * dt * multiplier;
              p.vy += ball.vy * force * 0.5 * dt * multiplier;
              if (distBall > 1) {
                p.vx += (dxBall / distBall) * CONFIG.WAKE_FORCE * force * 1.2 * dt * multiplier;
                p.vy += (dyBall / distBall) * CONFIG.WAKE_FORCE * force * 1.2 * dt * multiplier;
              }
            }
          }
          // -------------------------------------------------------------

          p.vx *= (1 - 0.5 * dt);
          p.vy *= (1 - 0.5 * dt);

          let nextX = p.x + p.vx * dt;
          let nextY = p.y + p.vy * dt;

          // ★ 新增：計算沙子與球體的物理碰撞 (單向影響，僅改變沙子速度/位置)
          const nextDxBall = nextX - ball.x;
          const nextDyBall = nextY - ball.y;
          const nextDistBall = Math.hypot(nextDxBall, nextDyBall) || 0.001;
          const minDistBall = p.size + CONFIG.BALL_RADIUS;
          
          if (nextDistBall < minDistBall) {
            // 被球體撞到了，將沙子推擠出球體半徑範圍
            const overlap = minDistBall - nextDistBall;
            const nx = nextDxBall / nextDistBall;
            const ny = nextDyBall / nextDistBall;
            
            nextX += nx * overlap;
            nextY += ny * overlap;
            
            // 計算相對速度
            const rvx = p.vx - ball.vx;
            const rvy = p.vy - ball.vy;
            const vNorm = rvx * nx + rvy * ny;
            
            if (vNorm < 0) {
              // 賦予被撞開的反彈力道
              const impulse = -(1 + CONFIG.SAND_BALL_BOUNCE) * vNorm;
              p.vx += nx * impulse;
              p.vy += ny * impulse;
              
              // 稍微加上一些被球切面帶動的摩擦力
              const tangentX = -ny;
              const tangentY = nx;
              const vTan = rvx * tangentX + rvy * tangentY;
              const tanImpulse = -vTan * 0.3; // 摩擦係數 0.3
              
              p.vx += tangentX * tanImpulse;
              p.vy += tangentY * tanImpulse;
            }
          }
          // -------------------------------------------------------------

          rings.forEach(ring => {
            const ringCenterX = center.x + ring.windOffsetX + ring.shakeX;
            const ringCenterY = center.y + ring.windOffsetY + ring.shakeY;
            const dx = nextX - ringCenterX;
            const dy = nextY - ringCenterY;
            const dist = Math.hypot(dx, dy) || 0.001;

            const thickness = CONFIG.RING_STROKE / 2 + p.size;
            
            if (Math.abs(dist - ring.radius) < thickness) {
              const angle = Math.atan2(dy, dx);
              
              if (!inGap(ring, angle)) {
                const isInside = dist < ring.radius;
                const targetDist = isInside ? ring.radius - thickness : ring.radius + thickness;
                nextX = ringCenterX + (dx / dist) * targetDist;
                nextY = ringCenterY + (dy / dist) * targetDist;

                const hitNormalX = isInside ? -(dx / dist) : (dx / dist);
                const hitNormalY = isInside ? -(dy / dist) : (dy / dist);
                
                const radialV = p.vx * hitNormalX + p.vy * hitNormalY;
                if (radialV < 0) { 
                  const vnX = hitNormalX * radialV;
                  const vnY = hitNormalY * radialV;
                  const vtX = p.vx - vnX;
                  const vtY = p.vy - vnY;

                  p.vx = vtX * CONFIG.SAND_FRICTION - vnX * CONFIG.SAND_BOUNCE;
                  p.vy = vtY * CONFIG.SAND_FRICTION - vnY * CONFIG.SAND_BOUNCE;

                  const ringTanSpeed = ring.radius * ring.rotationSpeed;
                  const ringTanX = -(dy / dist) * ringTanSpeed;
                  const ringTanY = (dx / dist) * ringTanSpeed;

                  p.vx += ringTanX * 0.035;
                  p.vy += ringTanY * 0.035;
                }
              }
            }
          });

          p.x = nextX;
          p.y = nextY;

          sandParticles.push(p);
          const cx = Math.floor(p.x / SAND_CELL_SIZE);
          const cy = Math.floor(p.y / SAND_CELL_SIZE);
          const key = cx + cy * 10000;
          if (spatialGrid.has(key)) {
            spatialGrid.get(key).push(p);
          } else {
            spatialGrid.set(key, [p]);
          }

        } else {
          // ==============================
          // 煙霧物理 (流體、消散、球體風壓)
          // ==============================
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= (1 - 1.2 * dt); 
          p.vy *= (1 - 1.2 * dt);
          p.vy -= CONFIG.UPDRAFT_FORCE * dt;
          
          p.vx += envWind.vx * dt;
          p.vy += envWind.vy * dt;

          p.x += Math.cos(p.life * p.swirlFreq + p.swirlPhaseX) * p.swirlAmp * dt;
          p.y += Math.sin(p.life * p.swirlFreq + p.swirlPhaseY) * p.swirlAmp * dt;

          const dx = p.x - ball.x;
          const dy = p.y - ball.y;
          const dist = Math.hypot(dx, dy);
          
          if (dist < CONFIG.WAKE_RADIUS) {
            const force = Math.pow(1 - dist / CONFIG.WAKE_RADIUS, 1.5);
            const bSpeed = Math.hypot(ball.vx, ball.vy) || 1;
            const bDirX = ball.vx / bSpeed;
            const bDirY = ball.vy / bSpeed;
            const dot = dx * bDirX + dy * bDirY;
            
            if (dot < 0) {
              p.vx += ball.vx * force * 2.8 * dt;
              p.vy += ball.vy * force * 2.8 * dt;
              const projX = bDirX * dot; 
              const projY = bDirY * dot;
              const toAxisX = projX - dx; 
              const toAxisY = projY - dy;
              const toAxisDist = Math.hypot(toAxisX, toAxisY) || 1;
              
              p.vx += (toAxisX / toAxisDist) * CONFIG.WAKE_FORCE * force * 0.9 * dt;
              p.vy += (toAxisY / toAxisDist) * CONFIG.WAKE_FORCE * force * 0.9 * dt;
            } else {
              p.vx += ball.vx * force * 0.5 * dt;
              p.vy += ball.vy * force * 0.5 * dt;
              if (dist > 1) {
                p.vx += (dx / dist) * CONFIG.WAKE_FORCE * force * 1.2 * dt;
                p.vy += (dy / dist) * CONFIG.WAKE_FORCE * force * 1.2 * dt;
              }
            }
          }
          p.life += dt;
        }
      });
      
      for (let i = 0; i < sandParticles.length; i++) {
        const p = sandParticles[i];
        const cx = Math.floor(p.x / SAND_CELL_SIZE);
        const cy = Math.floor(p.y / SAND_CELL_SIZE);

        for (let ox = -1; ox <= 1; ox++) {
          for (let oy = -1; oy <= 1; oy++) {
            const key = (cx + ox) + (cy + oy) * 10000;
            const cell = spatialGrid.get(key);
            
            if (cell) {
              for (let j = 0; j < cell.length; j++) {
                const other = cell[j];
                if (p.id < other.id) {
                  const dx = p.x - other.x;
                  const dy = p.y - other.y;
                  const distSq = dx * dx + dy * dy;
                  const minDist = p.size + other.size;

                  if (distSq < minDist * minDist && distSq > 0.0001) {
                    const dist = Math.sqrt(distSq);
                    const overlap = minDist - dist;
                    const nx = dx / dist;
                    const ny = dy / dist;

                    const correction = overlap * 0.5;
                    p.x += nx * correction;
                    p.y += ny * correction;
                    other.x -= nx * correction;
                    other.y -= ny * correction;

                    const rvx = p.vx - other.vx;
                    const rvy = p.vy - other.vy;
                    const vNorm = rvx * nx + rvy * ny;

                    if (vNorm < 0) {
                      const restitution = 0.05; 
                      const impulse = -(1 + restitution) * vNorm * 0.5;
                      
                      p.vx += nx * impulse;
                      p.vy += ny * impulse;
                      other.vx -= nx * impulse;
                      other.vy -= ny * impulse;

                      const tangentX = -ny;
                      const tangentY = nx;
                      const vTan = rvx * tangentX + rvy * tangentY;
                      const friction = 0.15; 
                      const tanImpulse = -vTan * friction * 0.5;

                      p.vx += tangentX * tanImpulse;
                      p.vy += tangentY * tanImpulse;
                      other.vx -= tangentX * tanImpulse;
                      other.vy -= tangentY * tanImpulse;
                    }
                  }
                }
              }
            }
          }
        }
      }

      particles = particles.filter(p => {
        if (p.type === 'sand') {
          return p.y < height + 100 && !p.dead;
        }
        return p.life < p.maxLife;
      });

      // --- 更新裝置本地時間 ---
      if (isTimeVisible) {
        const now = new Date();
        const h = now.getHours().toString().padStart(2, '0');
        const m = now.getMinutes().toString().padStart(2, '0');
        const s = now.getSeconds().toString().padStart(2, '0');
        // const timeString = `${h}:${m}:${s}`;
        const timeString = `${h}:${m}`;
        
        // 為了避免每幀頻繁操作 DOM，只在秒數有變動時才更新
        if (timeDisplay.textContent !== timeString) {
          timeDisplay.textContent = timeString;
        }
      }
    }

    function drawArc(radius, start, end, r, g, b, alpha, offsetX = 0, offsetY = 0, lineWidth = CONFIG.RING_STROKE) {
      context.beginPath();
      context.arc(center.x + offsetX, center.y + offsetY, radius, start, end);
      context.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
      context.lineWidth = lineWidth;
      context.lineCap = "round";
      context.stroke();
    }

    function drawRing(ring) {
      const gap = getGapHalfAngle(ring);
      const start = ring.gapAngle + gap;
      const end = ring.gapAngle - gap + Math.PI * 2;
      const ratio = clamp((ring.radius - CONFIG.FADE_START_RADIUS) / (CONFIG.FADE_END_RADIUS - CONFIG.FADE_START_RADIUS), 0, 1);
      const easeRatio = Math.pow(ratio, 1.2); 
      const r = Math.round(222 + (5 - 222) * easeRatio);
      const g = Math.round(226 + (5 - 226) * easeRatio);
      const b = Math.round(229 + (5 - 229) * easeRatio);
      const baseAlpha = 1 - easeRatio;
      
      drawArc(ring.radius, start, end, r, g, b, baseAlpha, ring.windOffsetX + ring.shakeX, ring.windOffsetY + ring.shakeY);
    }

    function drawParticles() {
      context.globalCompositeOperation = "source-over";
      particles.forEach(p => {
        if (p.type === 'sand' && !p.dead) {
          context.fillStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${p.alpha})`;
          context.fillRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
        }
      });

      context.globalCompositeOperation = "lighter";
      particles.forEach(p => {
        if (p.type === 'smoke') {
          const lifeRatio = p.life / p.maxLife;
          const currentSize = p.size + p.growth * lifeRatio;
          const alphaFade = 1 - Math.pow(lifeRatio, 1.5);
          const alpha = Math.max(0, alphaFade * p.baseAlpha);
          
          if (alpha > 0.005) {
            const grad = context.createRadialGradient(p.x, p.y, 0, p.x, p.y, currentSize);
            grad.addColorStop(0, `rgba(${p.color}, ${alpha})`);
            grad.addColorStop(0.4, `rgba(${p.color}, ${alpha * 0.5})`);
            grad.addColorStop(1, `rgba(${p.color}, 0)`);
            context.beginPath();
            context.arc(p.x, p.y, currentSize, 0, Math.PI * 2);
            context.fillStyle = grad;
            context.fill();
          }
        }
      });
      context.globalCompositeOperation = "source-over"; 
    }

    function drawBall() {
      for (let index = 0; index < ball.trail.length; index += 1) {
        const point = ball.trail[index];
        const alpha = (index / ball.trail.length) * 0.12;
        context.beginPath();
        context.arc(point.x, point.y, CONFIG.BALL_RADIUS * 0.75, 0, Math.PI * 2);
        context.fillStyle = `rgba(255,255,255,${alpha})`;
        context.fill();
      }

      context.save();
      context.translate(ball.x, ball.y);
      context.rotate(ball.angle);
      const shine = context.createRadialGradient(-4, -5, 1, 0, 0, CONFIG.BALL_RADIUS * 1.25);
      shine.addColorStop(0, "#ffffff");
      shine.addColorStop(0.64, "#f7f7f7");
      shine.addColorStop(1, "#cfd2d4");
      context.beginPath();
      context.arc(0, 0, CONFIG.BALL_RADIUS, 0, Math.PI * 2);
      context.fillStyle = shine;
      context.fill();
      context.strokeStyle = "rgba(255,255,255,.78)";
      context.lineWidth = 1;
      context.stroke();
      context.beginPath();
      context.arc(-3.2, -3.6, 2.2, 0, Math.PI * 2);
      context.fillStyle = "rgba(255,255,255,.96)";
      context.fill();
      context.beginPath();
      context.arc(0, 0, CONFIG.BALL_RADIUS * 0.57, -0.9, 0.9);
      context.strokeStyle = "rgba(112,118,122,.34)";
      context.lineWidth = 1.25;
      context.stroke();
      context.restore();
    }

    function drawRipples() {
      ripples.forEach(r => {
        const progress = r.age / 0.6; 
        const radius = 10 + progress * 50; 
        const alpha = (1 - progress) * 0.6; 
        context.beginPath();
        context.arc(r.x, r.y, radius, 0, Math.PI * 2);
        context.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
        context.lineWidth = 1.5;
        context.stroke();
      });
    }

    function render() {
      context.clearRect(0, 0, width, height);
      context.fillStyle = "#050505";
      context.fillRect(0, 0, width, height);
      rings.forEach((ring) => drawRing(ring));
      drawParticles(); 
      drawRipples();
      drawBall();
    }

    function frame(now) {
      const elapsed = Math.min((now - lastTime) / 1000, 0.034);
      lastTime = now;
      if (!paused) update(elapsed);
      render();
      requestAnimationFrame(frame);
    }

    canvas.addEventListener("pointerdown", (event) => {
      if (paused) return; 
      
      const rect = canvas.getBoundingClientRect();
      const touchX = event.clientX - rect.left;
      const touchY = event.clientY - rect.top;
      const dx = ball.x - touchX;
      const dy = ball.y - touchY;
      const dist = Math.hypot(dx, dy) || 1; 

      ball.vx += (dx / dist) * CONFIG.USER_IMPULSE;
      ball.vy += (dy / dist) * CONFIG.USER_IMPULSE;
      ripples.push({ x: touchX, y: touchY, age: 0 });

      for (let i = 0; i < CONFIG.CLICK_SMOKE_COUNT; i++) {
        const r = CONFIG.CLICK_SMOKE_RADIUS * Math.sqrt(Math.random());
        const theta = Math.random() * 2 * Math.PI;
        const px = touchX + r * Math.cos(theta);
        const py = touchY + r * Math.sin(theta);
        const burstSpeed = CONFIG.CLICK_SMOKE_BURST_MIN + Math.random() * (CONFIG.CLICK_SMOKE_BURST_MAX - CONFIG.CLICK_SMOKE_BURST_MIN);
        const vx = Math.cos(theta) * burstSpeed;
        const vy = Math.sin(theta) * burstSpeed;

        particles.push({
          id: nextParticleId++,
          type: 'smoke',
          x: px, y: py, vx: vx, vy: vy, life: 0,
          maxLife: CONFIG.SMOKE_MAX_LIFE * (0.25 + Math.random() * 0.1), 
          size: Math.random() * 10 + 5,      
          growth: 15 + Math.random() * 10,   
          color: `215, 220, 225`,            
          baseAlpha: 0.12 + Math.random() * 0.08, 
          swirlPhaseX: Math.random() * Math.PI * 2, swirlPhaseY: Math.random() * Math.PI * 2,
          swirlFreq: 1.5 + Math.random() * 2, swirlAmp: 10 + Math.random() * 20
        });
      }

      ball.boostDirX = -dx / dist;
      ball.boostDirY = -dy / dist;
      ball.boostSmokeTimer = CONFIG.BALL_BOOST_DURATION;
    });

    // 全螢幕切換邏輯
    fullscreenBtn.addEventListener("click", () => {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen().catch(console.error);
        } else if (docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    });

    // 監聽全螢幕狀態改變，更新按鈕文字
    function updateFullscreenText() {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        fullscreenBtn.textContent = "Exit Fullscreen";
      } else {
        fullscreenBtn.textContent = "Fullscreen";
      }
    }
    document.addEventListener("fullscreenchange", updateFullscreenText);
    document.addEventListener("webkitfullscreenchange", updateFullscreenText);

    window.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        paused = !paused;
        lastTime = performance.now();
      }
    });
    
    window.addEventListener("resize", resize);

    resize();
    reset();
    updateScoreDisplayMode(); // 初始化顯示狀態
    requestAnimationFrame(frame);
  </script>
</body>
</html>
